<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>Test WebSocket Connection</h1>
    
    <div>
        <h3>Send Test RSVP:</h3>
        <input type="text" id="testName" placeholder="Tên" value="Test User">
        <input type="text" id="testMessage" placeholder="Lời nhắn" value="Test message">
        <select id="testAttendance">
            <option value="Tôi nhất định sẽ tham gia">Sẽ tham gia</option>
            <option value="Thật tiếc tôi bận mất rồi">Không thể tham gia</option>
            <option value="Tôi sẽ nhắn lại sau">Chưa chắc chắn</option>
        </select>
        <button onclick="sendTestRSVP()">Gửi Test RSVP</button>
    </div>
    
    <div>
        <h3>WebSocket Status:</h3>
        <div id="status">Đang kết nối...</div>
    </div>
    
    <div>
        <h3>Console Output:</h3>
        <div id="console" style="background: #f0f0f0; padding: 10px; height: 400px; overflow-y: scroll;"></div>
    </div>

    <script>
        const consoleDiv = document.getElementById('console');
        const statusDiv = document.getElementById('status');
        
        function log(message) {
            console.log(message);
            consoleDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Khởi tạo Socket.IO
        log('🔄 Khởi tạo Socket.IO connection...');
        const socket = io('http://localhost:5500');
        
        socket.on('connect', () => {
            log('✅ Đã kết nối WebSocket: ' + socket.id);
            statusDiv.innerHTML = '🟢 Đã kết nối';
            statusDiv.style.color = 'green';
        });
        
        socket.on('disconnect', () => {
            log('❌ Mất kết nối WebSocket');
            statusDiv.innerHTML = '🔴 Mất kết nối';
            statusDiv.style.color = 'red';
        });
        
        socket.on('connect_error', (error) => {
            log('❌ Lỗi kết nối: ' + error);
            statusDiv.innerHTML = '🔴 Lỗi kết nối';
            statusDiv.style.color = 'red';
        });
        
        socket.on('initial-data', (data) => {
            log('📊 Nhận initial-data: ' + JSON.stringify(data, null, 2));
        });
        
        socket.on('new-rsvp', (data) => {
            log('🎉 Nhận new-rsvp event: ' + JSON.stringify(data, null, 2));
        });
        
        socket.on('rsvp-deleted', (data) => {
            log('🗑️ Nhận rsvp-deleted event: ' + JSON.stringify(data, null, 2));
        });
        
        socket.on('test', (data) => {
            log('🧪 Nhận test event: ' + JSON.stringify(data, null, 2));
        });
        
        // Function gửi test RSVP
        async function sendTestRSVP() {
            const name = document.getElementById('testName').value;
            const message = document.getElementById('testMessage').value;
            const attendance = document.getElementById('testAttendance').value;
            
            log('📤 Gửi test RSVP...');
            
            try {
                const response = await fetch('http://localhost:5500/submit-rsvp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        message: message,
                        form_item4: attendance
                    })
                });
                
                const result = await response.json();
                log('📥 Response: ' + JSON.stringify(result, null, 2));
                
                if (result.success) {
                    log('✅ RSVP gửi thành công!');
                } else {
                    log('❌ Lỗi: ' + result.message);
                }
            } catch (error) {
                log('❌ Lỗi fetch: ' + error);
            }
        }
    </script>
</body>
</html>
